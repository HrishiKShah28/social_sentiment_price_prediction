[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hengseng-sentiment-agent"
version = "0.1.0"
description = "Financial sentiment intelligence and price prediction agent for CrowdWisdomTrading"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Candidate", email = "candidate@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "yfinance>=0.2.40",
    "FinanceDataReader>=0.9.60",
    "apify-client>=1.7.0",
    "exa-py>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "streamlit>=1.34.0",
    "plotly>=5.22.0",
    "loguru>=0.7.2",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

